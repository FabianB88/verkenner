<!doctype html>
<html lang="nl" data-licht="nacht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>De Verkenner van de Steckenberg</title>
<meta name="description" content="Een smokkelaarstocht voor twee op Allerheiligenavond.">
<meta name="theme-color" content="#0d1311">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verkenner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: één smalle kolom als lantaarnlicht op een donker pad; vaste kopbalk; per etappe een live pijl. Bewust alleen donker. */
:root{
  color-scheme: dark;
  --night:#0d1311; --bark:#151e1a; --moss:#22302a;
  --mist:#d7ddd0; --mist-dim:#929d94;
  --lantern:#e3a246; --lantern-dim:#8a5d22;
  --paper:#d8cbaf; --ink:#2b2219; --good:#9cc59a;
  --display:'IM Fell DW Pica','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --body:'Spectral',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-licht="rood"]{
  --night:#0a0000; --bark:#150303; --moss:#2c0707;
  --mist:#ff5240; --mist-dim:#a8291e;
  --lantern:#ff2d1c; --lantern-dim:#7a140c;
  --paper:#2a0505; --ink:#ff5a48; --good:#ff5240;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--night); color:var(--mist);
  font-family:var(--body); font-size:17px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
[hidden]{display:none!important}
a{color:var(--lantern)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lantern);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding-block:0 72px}

.bar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--night);
  display:flex;align-items:center;gap:8px;padding-block:12px;border-bottom:1px solid var(--moss);
  margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline:max(16px, env(safe-area-inset-left, 0px));
}
.bar .brand{font-family:var(--display);font-size:19px;line-height:1.1;flex:1;min-width:0}
.bar .brand small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist-dim)}
.icon-btn{background:transparent;border:1px solid var(--moss);border-radius:999px;padding:7px 11px;font-family:var(--mono);font-size:12px;letter-spacing:.03em;cursor:pointer;color:var(--mist);white-space:nowrap}
.icon-btn[aria-pressed="true"]{border-color:var(--lantern);color:var(--lantern)}

h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(38px,11vw,54px);line-height:1}
h2{font-size:clamp(28px,8vw,36px);line-height:1.08}
h3{font-size:22px;line-height:1.2}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--lantern)}
p{margin:0}
.prose{display:flex;flex-direction:column;gap:14px;max-width:62ch}
.prose em{color:var(--lantern);font-style:italic}
.dim{color:var(--mist-dim)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:22px;margin-top:24px}

.hero{position:relative;padding-block:40px 8px;overflow:hidden}
.hero .fog{position:absolute;inset:-40px -60px;pointer-events:none;opacity:.5;
  background:radial-gradient(60% 30% at 20% 70%, rgba(215,221,208,.10), transparent 70%),radial-gradient(50% 25% at 80% 40%, rgba(215,221,208,.08), transparent 70%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.hero h1,.hero p{position:relative}
.hero .sub{margin-top:12px;font-style:italic;color:var(--mist-dim)}
.dateline{font-family:var(--display);font-style:italic;font-size:20px;color:var(--lantern)}

.block{border-top:1px solid var(--moss);padding-top:18px;display:flex;flex-direction:column;gap:12px}
.fact{background:var(--bark);border-radius:var(--r);padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;font-size:15.5px}
.fact summary{cursor:pointer;list-style:none}
.fact summary::-webkit-details-marker{display:none}
.field{border-left:2px solid var(--lantern);padding:2px 0 2px 14px;font-style:italic}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px;margin:0}
.kv dt{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mist-dim);padding-top:3px}
.kv dd{margin:0;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--lantern);color:var(--night);border:0;border-radius:999px;padding:13px 22px;font-family:var(--body);font-weight:600;font-size:16px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--mist);border:1px solid var(--moss);font-weight:400}
.btn.small{padding:9px 16px;font-size:14px}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(227,162,70,0)} 0%{box-shadow:0 0 0 0 rgba(227,162,70,.5)}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Live kompas */
.live{background:var(--bark);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.live svg{width:min(240px,70vw);height:auto;display:block}
.live .big{font-family:var(--display);font-size:44px;line-height:1}
.live .sub{font-family:var(--mono);font-size:13px;color:var(--mist-dim)}
.live .arrived{font-family:var(--display);font-size:26px;color:var(--lantern)}
#arrowG{transition:transform .25s linear}

.nav{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.rose-mini svg{width:96px;height:96px;display:block}
.bearing{font-family:var(--display);font-size:28px;line-height:1.05}
.bearing small{display:block;font-family:var(--mono);font-size:12.5px;color:var(--mist-dim);margin-top:6px}
.coords{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--mono);font-size:14px}
.coords code{background:var(--bark);padding:6px 10px;border-radius:4px;user-select:all}

/* Verzegelde brieven onderweg */
.seal{background:var(--bark);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:1px dashed var(--lantern-dim)}
.seal .eyebrow{color:var(--mist-dim)}
.seal.open{border-style:solid;border-color:var(--moss)}

.puzzle{background:var(--bark);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.answer{display:flex;gap:8px}
.answer input{flex:1;min-width:0;background:var(--night);border:1px solid var(--moss);border-radius:999px;padding:12px 16px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:16px}
.answer input:focus{border-color:var(--lantern);outline:none}
.msg{font-size:15px;min-height:1.4em}
.msg.bad{color:var(--lantern)}
.hint{font-size:15px;border-top:1px dashed var(--moss);padding-top:10px}
.hint b{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist-dim);display:block}
.knocks{display:flex;flex-wrap:wrap;gap:14px 22px;font-size:26px;letter-spacing:.18em;line-height:1;color:var(--lantern)}
.knocks span{white-space:nowrap}
.knocks i{display:inline-block;width:14px}
.grid5{border-collapse:collapse;font-family:var(--mono);font-size:15px;margin:0 auto}
.grid5 td,.grid5 th{width:36px;height:34px;text-align:center;border:1px solid var(--moss)}
.grid5 th{color:var(--mist-dim);font-weight:400;font-size:12px;border:0}
.cipher{font-family:var(--display);font-size:44px;letter-spacing:.3em;text-align:center;color:var(--lantern);padding-block:6px}
.rose-big svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
ol.clues{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}

.relic{background:var(--paper);color:var(--ink);border-radius:3px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.relic .inner{border:2px double var(--ink);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center}
.relic .serial{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}
.relic .name{font-family:var(--display);font-size:22px;line-height:1.15}
.relic .letter{font-family:var(--display);font-size:64px;line-height:.9;grid-row:2/4;grid-column:2;border:2px solid var(--ink);border-radius:50%;width:84px;height:84px;display:grid;place-items:center}
.relic .txt{font-size:14.5px;font-style:italic;line-height:1.45}
.reveal{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:.2;transform:translateY(14px) rotate(-1.5deg)}to{opacity:1;transform:none}}

.tokens{display:flex;gap:8px;flex-wrap:wrap}
.tok{width:44px;height:52px;border:1px solid var(--moss);border-radius:3px;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:var(--mist-dim)}
.tok.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* Overlays */
.sheet{position:fixed;inset:0;z-index:20;background:var(--night);overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px, env(safe-area-inset-left,0px))}
.sheet .wrap{padding-block:0}
.map svg{width:100%;height:auto;display:block}
.legend ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:15px}
.legend li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline}
.num{font-family:var(--mono);font-size:13px;color:var(--lantern)}
.status{font-family:var(--mono);font-size:12px;color:var(--mist-dim)}
.status.ok{color:var(--good)}

.event{position:fixed;inset:0;z-index:30;background:#000;color:var(--mist);display:flex;flex-direction:column;justify-content:center;gap:22px;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(24px, env(safe-area-inset-left,0px))}
.event h3{font-size:34px;color:var(--lantern)}
.event .prose{font-size:19px;line-height:1.55}
.event.flicker{animation:flick 2.4s steps(1) 1}
@keyframes flick{0%{opacity:0}6%{opacity:1}9%{opacity:.1}14%{opacity:1}19%{opacity:.25}24%{opacity:1}60%{opacity:1}64%{opacity:.4}68%{opacity:1}}
.dark{position:fixed;inset:0;z-index:40;background:#000;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
.dark span{font-family:var(--mono);font-size:12px;color:#1a1a1a;letter-spacing:.1em}

.ending{font-family:var(--display);font-size:22px;line-height:1.45;text-align:center;padding:18px 8px;border-block:1px solid var(--moss)}
.truth li{margin-bottom:8px}
.footer-note{font-size:13px;color:var(--mist-dim)}
@media (prefers-reduced-motion: reduce){.hero .fog,.reveal,.btn.pulse,.event.flicker{animation:none!important}#arrowG{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand">De Verkenner<small id="counter">Groesbeek · Allerheiligenavond</small></div>
    <button class="icon-btn" id="btnMap" type="button">Kaart</button>
    <button class="icon-btn" id="btnRed" type="button" aria-pressed="false">Rood</button>
  </header>
  <main id="view"></main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="wrap">
    <div class="row" style="justify-content:space-between;padding-block:6px 14px">
      <h3>Smokkelkaart</h3>
      <button class="icon-btn" id="btnClose" type="button">Sluiten</button>
    </div>
    <div class="map" id="map"></div>
    <div class="legend" id="legend" style="margin-top:18px"></div>
    <p class="footer-note" style="margin-top:16px">Hemelsbreed, noorden boven. De streepjeslijn is de volgorde, niet het pad. Punt 2 ligt ergens in het bos boven de trap. De witte stip zijn jullie, als het live kompas aan staat.</p>
  </div>
</div>

<div class="event" id="event" hidden role="dialog" aria-modal="true" aria-labelledby="evTitle">
  <p class="eyebrow" id="evEyebrow">Onderweg</p>
  <h3 id="evTitle"></h3>
  <div class="prose" id="evText"></div>
  <div class="row"><button class="btn" id="evClose" type="button">Verder</button></div>
</div>

<div class="dark" id="dark" hidden><span id="darkTxt">tik om te stoppen</span></div>

<script>
(function(){
"use strict";

var HOME = {name:'Thuis aan de Stekkenberg', short:'Thuis', lat:51.7829009, lng:5.9239603};

var STATIONS = [
{
  id:'trap', short:'Koekeleklef', title:'De trap van de Koekeleklef', place:'Ingang Avonturenbos, aan de Koekeleklef',
  lat:51.7850633, lng:5.91739,
  leg:'Loop naar de bosrand in het noordwesten. De trap van de Koekeleklef ligt bij de ingang van het Avonturenbos, aan de straat die ook Koekeleklef heet. Hier liep Driek het donker in.',
  events:[
    {at:0.45, fx:'heartbeat', title:'Niet omkijken', text:['Vanaf jullie voordeur loopt er iemand mee. Op dezelfde afstand. In hetzelfde tempo.','Kijk niet om. Kijk naar de ramen die jullie passeren en tel de ramen waar een kaars of lichtje brandt.','Onthoud dat getal. Hij telt ook.']}
  ],
  arrive:[
    'Hier zag Mie hem voor het laatst. De treden gaan steil omhoog, het zwart in. Smokkelaars namen deze weg met volle pungels op hun nek, hijgend, de verkenner voorop.',
    'Praten deden ze niet. Wie praat, wordt gehoord. De verkenner klopte. Met een tak tegen een stam: eerst een aantal tikken, dan een korte stilte, dan weer tikken. De groep achter hem wist precies wat het betekende.',
    'Op de onderste trede, in het hout gekrast, staat een reeks tikken. Het laatste bericht van de verkenner. Als het stil genoeg is, hoor je ze nog.'
  ],
  field:'Zet het geluid van je telefoon aan en speel de tikken af. Tel daarna samen de treden terwijl je klimt, fluisterend. Wie bovenaan als eerste het getal zegt, mag het raadsel voorlezen.',
  puzzle:{type:'knock',
    prompt:'Elke groep tikken is één letter. De eerste reeks is de rij, de tweede de kolom. Een K bestaat niet: daarvoor klopte men een C.',
    seq:[[5,1],[3,4],[4,3]], question:'Wie klopte hier?', answers:['VOS','DEVOS'],
    hints:['Begin bij de eerste letter: vijf tikken, dan één. Rij 5, kolom 1.','Het is zijn bijnaam. Drie letters, een dier.']},
  relic:{name:'Een spijker uit een spoorbiels', text:'Vierkant, roestig, ijskoud. Iemand heeft er met een mes een letter in gekrast.', letter:'E'},
  kroniek:[
    'De trap ligt bij de ingang van het Avonturenbos, op grond van Staatsbosbeheer. De oude treden waren spoorbielzen uit 1950. In 2018 zijn ze vervangen door zo’n zeventig boomstammen.',
    'Bielzen passen bij Groesbeek: vanaf 1865 reed hier een trein naar Nijmegen en naar Kleef, tot 1991.'
  ]
},
{
  id:'bos', short:'Het bos', title:'Tussen de stammen', place:'Minstens 150 meter het bos in, boven de trap',
  lat:null, lng:null, away:150,
  leg:'Klim de trap op en loop het bos in, tot het stil wordt en de straatlantaarns achter jullie verdwenen zijn. Blijf op het pad. Er is hier geen vaste plek: met het live kompas zie je hoe ver jullie van de trap zijn.',
  events:[],
  arrive:[
    'Hier was Driek veilig. Zonder licht, want een lamp zie je van een kilometer ver. Hij las het bos met zijn voeten en de lucht met zijn ogen. Het noorden wist hij aan de Poolster, het westen aan de laatste streep licht boven de Mookerheide.',
    'In de voering van zijn pet had hij een kompasroos genaaid. Geen naald, alleen letters. Zijn eigen code.',
    'Maar eerst: doe je lamp uit. Alles uit. Ook dit scherm.'
  ],
  field:'Druk op De duisternis. Het scherm wordt een minuut helemaal zwart. Gaan staan, hand in hand, en tel wat je hoort. Als het geluid aan staat, luister dan goed. Daarna: open het kompas op je telefoon en wijs allebei naar het oosten. Daar ligt de grens. Daar wachtten de kommiezen.',
  darkness:true,
  puzzle:{type:'rose', prompt:'Lees de letters van de kompasroos in deze volgorde:',
    clues:['Waar de Wolfsberg ligt, gezien vanaf de Stekkenberg.','Tussen het zuiden en waar de zon ondergaat.','Waar de zon ondergaat.','Halverwege tussen het westen en de Poolster.'],
    question:'Waar ging de Vos heen?', answers:['WOLF','WOLFSBERG','DEWOLFSBERG'],
    hints:['Vanaf de Stekkenberg ligt de Wolfsberg recht naar het zuiden. Begin bij de letter onder Z.','Z, ZW, W, NW. Een dier.']},
  relic:{name:'Een biljet noodgeld uit Kranenburg', text:'Op de voorkant smokkelaars met zakken op hun rug. Op de achterkant, met potlood: één letter.', letter:'L'},
  kroniek:[
    'In de jaren rond 1920 drukte Kranenburg, net over de grens, eigen noodgeld. Op de eerste serie stonden smokkelaars, en de kommiezen werden afgebeeld als joker.',
    'De Duitse grenswachten vonden het een schande en protesteerden. De gemeenteraad van Kranenburg legde hun klacht naast zich neer.',
    'Smokkelgroepen stuurden iemand vooruit om te zien of er grenswachten in de buurt lagen.'
  ]
},
{
  id:'wolf', short:'Wolfsberg', title:'De Wolfsberg', place:'Hotel-Restaurant De Wolfsberg, Mooksebaan 12',
  lat:51.7748198, lng:5.9266629,
  leg:'Ga door het bos richting zuid-zuidoost. De Wolfsberg is een heuvel aan de zuidkant van het bos, met bovenop een hotel-restaurant aan de Mooksebaan. Twijfel je bij een splitsing, volg de pijl of open de looproute in Maps.',
  events:[
    {at:0.3, fx:'drone', title:'Iets loopt mee', text:['Stop.','Iets loopt in hetzelfde tempo als jullie, net buiten het pad. Hoor je het?','Loop tien passen, en stop dan abrupt, allebei tegelijk. Loopt het nog een stap door?']},
    {at:0.6, fx:'knock', title:'Smokkelregel', text:['Drie tikken. Kommies.','Vanaf hier geen woord meer tot de Wolfsberg. Wie praat, verraadt de groep. Komt er licht aan op het pad: lampen uit, stilstaan, gezicht van het licht af.']},
    {at:0.85, fx:'heartbeat', title:'Hij hijgt', text:['Driek droeg iets om zijn nek dat hem hier beschermde. Jullie niet.','Loop dichter bij elkaar. Nog een klein stuk.']}
  ],
  arrive:[
    'Op deze heuvel schoten ze de laatste wolf. Dat is geen verhaal. Dat is echt gebeurd, in de negentiende eeuw.',
    'De ouden op de Steckenberg zeiden dat de wolf niet dood was. Dat hij alleen van vorm was veranderd. Dat hij nog altijd door het bos liep, vlak naast wie er alleen liep, net buiten het licht van je lamp. Wat jullie onderweg hoorden, zeiden ze, was hij.',
    'Driek droeg een wolfstand aan een leren veter om zijn nek. Niet voor de sier. Wie de wolf bij zich draagt, wordt door de wolf met rust gelaten.',
    'Kijk om je heen naar de bomen. Ze staan in rechte rijen. Dit bos is niet vanzelf gegroeid.'
  ],
  field:'Zoek een boom met een gladde, grijze stam. Leg allebei je hand erop, naast elkaar, en houd hem daar tot een van jullie iets hoort.',
  puzzle:{type:'text',
    prompt:'Rijke heren zetten ons hier neer, in rechte rijen, op de hei waar arme mensen bezems bonden. Onze stam is glad en grijs, onze nootjes eten de muizen, en in de herfst laten we koperen bladeren vallen.',
    question:'Wie zijn wij?', answers:['BEUK','BEUKEN','BEUKENBOOM','BEUKENBOMEN','DEBEUK','DEBEUKEN'],
    hints:['Denk aan de lanen in dit bos.','Vier letters, begint met een B.']},
  relic:{name:'Een wolfstand aan een leren veter', text:'Geel, gebarsten, warmer dan hij zou moeten zijn. In de veter is een knoop gelegd in de vorm van een letter.', letter:'U'},
  kroniek:[

function startCompass(){

  if(typeof DeviceOrientationEvent.requestPermission==='function'){
    var p;
    try{p=DeviceOrientationEvent.requestPermission();}catch(e){p=Promise.reject(e);}
    p.then(function(r){
      if(r==='granted'){window.addEventListener('deviceorientation',onOri,true);watchCompass();}
      else{geo.oriMsg='Kompas geweigerd. Sluit de app helemaal af, open hem opnieuw en kies Sta toe';updateArrow();}
    },function(){geo.oriMsg='Kompas niet toegestaan. Sluit de app helemaal af en probeer het opnieuw';updateArrow();});

function checkEvents(){
  var t=currentTarget(); if(!t||!t.events||!t.events.length||!geo.pos)return;
  var total=dist(t.from,t.pt), d=dist(geo.pos,t.pt), prog=1-d/total;
  for(var k=0;k<t.events.length;k++){
    var ev=t.events[k], id=t.key+'-'+k;
    if(!state.fired[id] && prog>=ev.at){ fireEvent(ev,id); break; }
  }
}
function fireEvent(ev,id){

  o.hidden=false; o.classList.remove('flicker'); void o.offsetWidth; o.classList.add('flicker');

}

    dirs.forEach(function(d){var a=rad(d[1]),x=150+Math.sin(a)*100,y=150-Math.cos(a)*100,big=d[0].length===1;
      svg+='<line x1="150" y1="150" x2="'+(150+Math.sin(a)*(big?78:62)).toFixed(1)+'" y2="'+(150-Math.cos(a)*(big?78:62)).toFixed(1)+'" stroke="var(--mist-dim)" stroke-width="'+(big?1.6:1)+'"/>';
      svg+='<text x="'+x.toFixed(1)+'" y="'+(y+11).toFixed(1)+'" text-anchor="middle" font-family="IM Fell DW Pica, Georgia, serif" font-size="32" fill="var(--lantern)">'+L[d[0]]+'</text>';});
    svg+='<circle cx="150" cy="150" r="4" fill="var(--mist)"/></svg>';

  }

}

  $('form').addEventListener('submit',function(e){e.preventDefault();var v=norm($('ans').value);
    if(!v){msg.textContent='Typ eerst een antwoord.';msg.className='msg bad';return;}
    if(p.answers.some(function(a){return norm(a)===v;}))solve(s);
    else{msg.textContent=['Nee. In de verte kraakt een tak.','Nee. Iets ademt uit, vlak achter je.','Nee. De wind valt even stil.'][Math.floor(Math.random()*3)];msg.className='msg bad';vib(60);}
  });
  var hb=$('hint');if(hb)hb.onclick=function(){state.hints[s.id]=(state.hints[s.id]||0)+1;save();render();};
  var gb=$('giveup');if(gb){gb.onclick=function(){$('giveupConfirm').hidden=false;gb.hidden=true;};$('giveYes').onclick=function(){solve(s);};$('giveNo').onclick=function(){$('giveupConfirm').hidden=true;gb.hidden=false;};}
}
function solve(s){
  state.solved[s.id]=true;save();
  $('pz').innerHTML='<p class="eyebrow">Opgelost</p><p>'+esc(s.puzzle.question)+' <b class="mono" style="letter-spacing:.12em">'+esc(s.puzzle.answers[0])+'</b></p><p class="dim">Iets glinstert in het licht van jullie lamp.</p>';
  $('relicSlot').innerHTML=relicCard(s,state.i,true);
  $('nextRow').hidden=false;
  $('counter').textContent='Tekens '+solvedCount()+' van 6';
  chime(); vib([40,60,40]);
  setTimeout(function(){var r=$('relicSlot');if(r&&r.scrollIntoView)r.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});},120);
}

function renderFinal(){
  var letters=STATIONS.map(function(s){return state.solved[s.id]?s.relic.letter:'?';}),missing=letters.indexOf('?')>=0;
  var top='<div><p class="eyebrow">Thuis · de pungel</p><h2 style="margin-top:8px">Wat zocht de Vos?</h2></div>'+
    '<div class="tokens">'+letters.map(function(l){return '<div class="tok'+(l!=='?'?' on':'')+'">'+l+'</div>';}).join('')+'</div>';
  if(!state.done){
    view.innerHTML='<div class="stack">'+top+
      '<div class="prose"><p>Ga binnen zitten, in het donker, met alleen het scherm aan. Leg de zes tekens neer. De letters staan door elkaar, zoals Driek ze achterliet. In de goede volgorde vormen ze het woord dat de hele avond al voor jullie neus lag.</p>'+
      (missing?'<p class="dim">Er ontbreken nog tekens. Je kunt teruggaan, of het toch proberen.</p>':'')+'</div>'+
      '<div class="puzzle"><form class="answer" id="form" autocomplete="off"><label for="ans" style="position:absolute;left:-9999px">Het woord</label><input id="ans" placeholder="Het woord" autocapitalize="characters" spellcheck="false"><button class="btn small" type="submit">Open</button></form>'+
      '<p class="msg" id="msg" aria-live="polite"></p><div class="row"><button class="btn ghost small" id="fhint" type="button">Hint</button></div><p class="hint" id="fhintText" hidden><b>Hint</b>Het staat in de proloog. Iets wat je op je nek draagt.</p></div>'+
      '<div class="row"><button class="btn ghost small" id="back" type="button">Terug</button></div></div>';
    $('form').addEventListener('submit',function(e){e.preventDefault();var v=norm($('ans').value),m=$('msg');
      if(FINAL_ANSWERS.some(function(a){return norm(a)===v;})){state.done=true;save();heartbeat(3);setTimeout(renderFinal,1800);}
      else{m.textContent='De letters zwijgen. Probeer een andere volgorde.';m.className='msg bad';}});
    $('fhint').onclick=function(){$('fhintText').hidden=false;this.hidden=true;};
    $('back').onclick=function(){state.pos='home';save();render();};
    return;
  }
  view.innerHTML='<div class="stack">'+top+
    '<div class="prose reveal"><p class="dateline">De pungel.</p>'+
      '<p>Er zaten geen Marken in. Geen tabak, geen boter, geen zeep.</p>'+
      '<p>Die nacht liep Driek niet naar de grens om te smokkelen. Hij had een jaar lang gespaard, in Marken, en hij wist wat in Kranenburg al werd gefluisterd: dat dat geld binnenkort niets meer waard zou zijn. Dus ging hij het uitgeven zolang het nog kon. Aan één ding.</p>'+
      '<p>In de pungel zat een ring. En een briefje, met potlood, in hoofdletters, want schrijven deed hij niet vaak.</p></div>'+
    '<p class="ending reveal">KOM IK NIET TERUG,<br>ZET DAN EEN LICHT IN HET RAAM.<br>DAN VIND IK DE WEG.</p>'+
    '<div class="prose reveal"><p>Mie heeft de pungel nooit gekregen. Maar elk jaar op Allerheiligenavond zette ze een kaars voor het raam. Tot haar dood. Daarna niemand meer.</p>'+
      '<p>Daarom loopt hij nog. Vanavond liep hij voor jullie uit, de hele weg, tot aan jullie deur.</p></div>'+
    '<div class="block"><p class="eyebrow">Laatste opdracht</p><p class="field">Zet samen een kaars of een lichtje voor jullie raam aan de Stekkenberg. Pas daarna mag het licht binnen aan. Dan kan de Vos eindelijk ophouden met lopen.</p></div>'+
    '<div class="block"><p class="eyebrow">Wat is verzonnen, wat niet</p><ul class="truth" style="margin:0;padding-left:18px;font-size:15.5px">'+
      TRUTH.map(function(t){return '<li><b>'+esc(t[0])+'.</b> '+esc(t[1])+'</li>';}).join('')+'</ul>'+
      '<p class="dim" style="font-size:14px">Bronnen:</p><ul style="margin:0;padding-left:18px;font-size:14px">'+SOURCES.map(function(s){return '<li><a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[0])+'</a></li>';}).join('')+'</ul></div>'+
    '<div class="row"><button class="btn ghost small" id="restart" type="button">Terug naar het begin</button></div>'+
  '</div>';
  $('restart').onclick=function(){state.resumePos='final';state.pos='start';save();render();};
}

/* ---------- Kaart ---------- */
function renderMap(){
  var koek=STATIONS[0];
  var pts=[{label:'Thuis',lat:HOME.lat,lng:HOME.lng,home:true}];
  STATIONS.forEach(function(s,i){pts.push(s.lat!=null?{label:(i+1)+' '+s.short,lat:s.lat,lng:s.lng,i:i}:{label:(i+1)+' '+s.short,lat:koek.lat-0.0009,lng:koek.lng-0.0004,i:i,approx:true});});
  var all=pts.slice(); if(geo.pos)all.push({lat:geo.pos.lat,lng:geo.pos.lng,me:true});
  var k=Math.cos(rad(HOME.lat))*111320;
  var xy=all.map(function(p){return {x:(p.lng-HOME.lng)*k,y:-(p.lat-HOME.lat)*111320};});
  var xs=xy.map(function(p){return p.x;}),ys=xy.map(function(p){return p.y;});
  var minX=Math.min.apply(null,xs),maxX=Math.max.apply(null,xs),minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys);
  var W=360,pad=46,sc=(W-2*pad)/Math.max(maxX-minX,maxY-minY),H=Math.round((maxY-minY)*sc+2*pad);
  var P=xy.map(function(p){return {x:pad+(p.x-minX)*sc,y:pad+(p.y-minY)*sc};});
  var path=[0,1,2,3,4,5,6,0].map(function(n,j){return (j?'L':'M')+P[n].x.toFixed(1)+' '+P[n].y.toFixed(1);}).join(' ');
  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Schematische kaart van de route"><rect width="'+W+'" height="'+H+'" fill="var(--bark)" rx="6"/>';
  svg+='<path d="'+path+'" fill="none" stroke="var(--lantern-dim)" stroke-width="1.6" stroke-dasharray="4 6"/>';
  var cur=(state.pos==='home'||state.pos==='final')?'home':state.i;
  pts.forEach(function(pt,n){var p=P[n],done=pt.home?state.done:!!state.solved[STATIONS[pt.i].id],isCur=pt.home?cur==='home':cur===pt.i;
    if(isCur)svg+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="13" fill="none" stroke="var(--lantern)" stroke-width="1.5"/>';
    svg+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(pt.home?7:6)+'" fill="'+(done||pt.home?'var(--lantern)':'var(--night)')+'" stroke="var(--lantern)" stroke-width="1.5"'+(pt.approx?' stroke-dasharray="2 2"':'')+'/>';
    var right=p.x<W/2;svg+='<text x="'+(p.x+(right?14:-14)).toFixed(1)+'" y="'+(p.y+4).toFixed(1)+'" text-anchor="'+(right?'start':'end')+'" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--mist)">'+esc(pt.label)+(pt.approx?' (ca.)':'')+'</text>';});
  if(geo.pos){var me=P[P.length-1];svg+='<circle cx="'+me.x.toFixed(1)+'" cy="'+me.y.toFixed(1)+'" r="6" fill="#ffffff" stroke="var(--night)" stroke-width="2"/>';}
  var m500=500*sc;svg+='<line x1="16" y1="'+(H-16)+'" x2="'+(16+m500).toFixed(1)+'" y2="'+(H-16)+'" stroke="var(--mist-dim)" stroke-width="2"/><text x="16" y="'+(H-22)+'" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--mist-dim)">500 m</text>';
  svg+='<text x="'+(W-18)+'" y="22" text-anchor="middle" font-family="IM Fell DW Pica, Georgia, serif" font-size="16" fill="var(--mist)">N</text><path d="M'+(W-18)+' 28 L'+(W-12)+' 42 L'+(W-18)+' 38 L'+(W-24)+' 42 Z" fill="var(--mist)"/></svg>';
  $('map').innerHTML=svg;
  $('legend').innerHTML='<ol>'+STATIONS.map(function(s,i){var ok=!!state.solved[s.id];return '<li><span class="num">'+(i+1)+'</span><span>'+esc(s.title)+'<br><span class="dim" style="font-size:13.5px">'+esc(s.place)+'</span></span><span class="status'+(ok?' ok':'')+'">'+(ok?s.relic.letter:'open')+'</span></li>';}).join('')+'</ol>';
}

$('btnRed').onclick=function(){state.red=!state.red;save();document.documentElement.setAttribute('data-licht',state.red?'rood':'nacht');this.setAttribute('aria-pressed',state.red?'true':'false');};
$('btnMap').onclick=function(){renderMap();$('sheet').hidden=false;};
$('btnClose').onclick=function(){$('sheet').hidden=true;};

var lock=null;
function wireWake(){var b=$('wake');if(!b)return;b.onclick=function(){var m=$('wakeMsg');if(!('wakeLock' in navigator)){m.textContent='Kan niet op dit toestel.';return;}navigator.wakeLock.request('screen').then(function(l){lock=l;m.textContent='Scherm blijft aan.';},function(){m.textContent='Niet toegestaan.';});};}
document.addEventListener('visibilitychange',function(){if(lock&&document.visibilityState==='visible'){try{navigator.wakeLock.request('screen').then(function(l){lock=l;},function(){});}catch(e){}}});

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}

render();
})();
</script>
